<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANLO TOMATO LINK</title>
<meta name="theme-color" content="#15251b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#15251b; --sub:#4d6355; --line:#d5dfd7; --bg:#f4f7f4; --card:#ffffff;
  --leaf:#2b6a3d; --leaf-soft:#e2efe5; --tom:#c4301c; --tom-soft:#fbe6e2; --amber:#b57900; --amber-soft:#fbf0d2; --blue:#2c5d8f;
  --c-demand:#2b6a3d; --c-ripe:#c4301c; --c-dist:#2c5d8f; --c-price:#b57900; --c-track:#6b4c8f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:78px}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:baseline;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;letter-spacing:.2px}
header span{font-size:13px;opacity:.75}
header .phase{margin-left:auto;font-size:12px;background:var(--leaf);padding:3px 9px;border-radius:99px;opacity:1;cursor:pointer;border:0;color:#fff}
header .phase.pilot{background:var(--tom)}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:15px;margin:0 0 6px}
p{margin:6px 0}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 130px}
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid #b9c7bd;border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #7fb48f;outline-offset:1px}
input[type=checkbox]{width:auto;margin-right:8px}
button,.btn{font:inherit;font-size:14px;padding:9px 13px;border-radius:6px;border:1px solid var(--leaf);background:var(--leaf);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:#fff;color:var(--leaf)}
button.warn{background:#fff;color:var(--tom);border-color:var(--tom)}
button.small,.btn.small{padding:6px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf);margin-left:6px}
.badge.demo{background:var(--amber-soft);color:var(--amber)}
.badge.hot{background:var(--tom-soft);color:var(--tom)}
.badge.gray{background:#e9eee9;color:var(--sub)}
.empty{border:1px dashed #b9c7bd;border-radius:10px;padding:16px;color:var(--sub);text-align:center;background:#fafcfa}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;border:0;background:none;color:var(--sub);border-radius:0;padding:12px 2px 14px;font-size:13px;border-top:3px solid transparent}
nav button[aria-current=page]{color:var(--leaf);border-top-color:var(--leaf);font-weight:700}
.score{display:flex;gap:12px;align-items:center}
.score .num{font-size:30px;font-weight:800;min-width:56px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e9eee9;flex:1}
.bar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:6px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{flex:1 1 120px;background:var(--leaf-soft);border-radius:8px;padding:10px}
.kpi div.t{background:var(--tom-soft)}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.note{background:var(--amber-soft);border-left:4px solid var(--amber);padding:9px 12px;border-radius:4px;font-size:14px;margin:10px 0}
.err{color:var(--tom);font-size:14px;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:9}
#toast.on{opacity:1}
svg text{font-family:inherit}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>ANLO TOMATO LINK</h1><span>Anloga pilot</span>
  <button class="phase" id="phaseBtn" title="Tap to switch the current study phase"></button>
</header>
<main id="app"></main>
<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- state & storage ---------- */
let storageOk = true;
const KEY = 'anlo-link-v1';
const RIPE = [['green','Green'],['turning','Turning'],['ripe','Ripe'],['veryripe','Very ripe / soft']];
const RIPE_IDX = {green:0,turning:1,ripe:2,veryripe:3};
const W = {demand:30, ripeness:25, distance:15, price:15, track:15};
const COLORS = {demand:'var(--c-demand)',ripeness:'var(--c-ripe)',distance:'var(--c-dist)',price:'var(--c-price)',track:'var(--c-track)'};
const LABELS = {demand:'Can take the load',ripeness:'Ripeness fit',distance:'Nearness',price:'Price',track:'Track record'};
const DEF = {
  v:1,
  settings:{phase:'baseline',tempAlert:30,rhMin:80,windowDays:2,
    template:'Hello {buyer}, {farmer} ({community}) has {kg} kg of {ripeness} tomatoes ready. Ask price: {price}. Can you take them today? Reply YES or NO. From ANLO TOMATO LINK.'},
  farmers:[],buyers:[],loads:[],offers:[],batches:[],sensor:{rows:[],name:'',at:null}
};
function clone(o){return JSON.parse(JSON.stringify(o))}
function loadState(){
  try{
    const r = localStorage.getItem(KEY);
    if(r){const o = JSON.parse(r); const d = clone(DEF); return Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{}),sensor:Object.assign(d.sensor,o.sensor||{})});}
  }catch(e){storageOk=false}
  return clone(DEF);
}
let S = loadState();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){storageOk=false;toast('Could not save on this device. Export a backup now.')}
}
const ui = {tab:'match', openLoad:null, ans:null, showFarmerForm:false, showBuyerForm:false, chartCrate:null};
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const real = a => a.filter(x=>!x.demo);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n)?n:null; };
const f1 = n => n==null?'-':(Math.round(n*10)/10).toString();
const pct = n => n==null?'-':(Math.round(n*1000)/10)+'%';
const ripeLabel = k => (RIPE.find(r=>r[0]===k)||[k,k])[1];
const byId = (arr,id) => arr.find(x=>x.id===id);
function fmtDT(ms){const d=new Date(ms);return d.toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function toLocalInput(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function normPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='233'+d.slice(1);return d}

/* ---------- sensor data helpers ---------- */
function readingsFor(crate,demoOk){
  return S.sensor.rows.filter(r=>String(r[0]).toLowerCase()===String(crate).toLowerCase() && (demoOk||!r[5]))
    .map(r=>({t:r[1]!=null?r[1]:r[2]*1000,temp:r[3],rh:r[4],clock:r[1]!=null})).sort((a,b)=>a.t-b.t);
}
function latestReading(crate){const a=readingsFor(crate,true);return a.length?a[a.length-1]:null}
function crateList(demoOk){const s=new Set();S.sensor.rows.forEach(r=>{if(demoOk||!r[5])s.add(String(r[0]))});return [...s].sort()}
function hoursOutside(rs){
  let hT=0,hR=0;
  for(let i=0;i<rs.length-1;i++){
    const dt=Math.min(rs[i+1].t-rs[i].t,1800000)/3.6e6;
    if(rs[i].temp>S.settings.tempAlert)hT+=dt;
    if(rs[i].rh!=null&&rs[i].rh<S.settings.rhMin)hR+=dt;
  }
  return {hT,hR};
}

/* ---------- matching logic (rule-based scorer with a simple learning term) ---------- */
function urgency(load,now,heat){
  const base=[0.1,0.4,0.7,1][RIPE_IDX[load.ripeness]||0];
  const hrs=Math.max(0,(now-new Date(load.harvestAt).getTime())/3.6e6);
  return Math.min(1, base + Math.min(hrs/24,1)*0.3 + (heat?0.2:0));
}
function remainingDemand(buyer,dayStr){
  const used=S.offers.filter(o=>o.buyerId===buyer.id&&o.status==='accepted'&&(o.respondedAt?new Date(o.respondedAt):new Date(o.at)).toDateString()===new Date(dayStr).toDateString())
    .reduce((s,o)=>s+(o.kgAgreed||0),0);
  return Math.max(0,(buyer.demandKg||0)-used);
}
function buyerStats(buyerId){
  const os=S.offers.filter(o=>o.buyerId===buyerId&&o.status!=='offered');
  return {offers:os.length,accepted:os.filter(o=>o.status==='accepted').length};
}
function scoreBuyer(load,buyer,ctx){
  const rem=ctx.remaining;
  const diff=Math.abs((RIPE_IDX[load.ripeness]||0)-Math.max(0,...(buyer.ripeness||[]).map(k=>RIPE_IDX[k]||0)));
  let ripeFit=0;
  if((buyer.ripeness||[]).includes(load.ripeness))ripeFit=1;
  else if((buyer.ripeness||[]).some(k=>Math.abs(RIPE_IDX[k]-RIPE_IDX[load.ripeness])===1))ripeFit=0.4;
  const s={
    demand: load.kg>0?Math.min(1,rem/load.kg):0,
    ripeness: ripeFit,
    distance: Math.max(0,1-(buyer.km||0)/40),
    price: (buyer.price&&load.ask)?Math.min(1,buyer.price/load.ask):0.5,
    track: (ctx.stats.accepted+1)/(ctx.stats.offers+2)
  };
  const w=Object.assign({},W); w.distance=W.distance+20*ctx.urgency;
  const tot=Object.values(w).reduce((a,b)=>a+b,0);
  const parts={};let score=0;
  for(const k in s){parts[k]=w[k]*s[k]/tot*100;score+=parts[k]}
  return {score,parts,s,unused:diff};
}
function rankBuyers(load){
  const now=Date.now();
  const cr=load.crateId?latestReading(load.crateId):null;
  const heat=!!(cr&&cr.temp>S.settings.tempAlert);
  const u=urgency(load,now,heat);
  const list=S.buyers.filter(b=>!!b.demo===!!load.demo || !load.demo).map(b=>{
    const r=scoreBuyer(load,b,{remaining:remainingDemand(b,new Date()),stats:buyerStats(b.id),urgency:u});
    return {buyer:b,...r};
  }).sort((a,b)=>b.score-a.score);
  return {list,u,heat,cr};
}
function offerMessage(load,buyer){
  const f=byId(S.farmers,load.farmerId)||{};
  return S.settings.template
    .replace('{buyer}',buyer.name).replace('{farmer}',f.name||'A farmer').replace('{community}',f.community||'Anloga')
    .replace('{kg}',load.kg).replace('{ripeness}',ripeLabel(load.ripeness).toLowerCase())
    .replace('{price}',load.ask?('GHS '+load.ask+'/kg'):'price to agree');
}

/* ---------- views ---------- */
const app=document.getElementById('app');
const TABS=[['match','Match'],['buyers','Buyers'],['log','Log'],['crates','Crates'],['results','Results']];
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-act="tab" data-tab="${t[0]}" ${ui.tab===t[0]?'aria-current="page"':''}>${t[1]}</button>`).join('');
  const pb=document.getElementById('phaseBtn');
  pb.textContent=S.settings.phase==='pilot'?'Phase: pilot (system on)':'Phase: baseline';
  pb.className='phase '+(S.settings.phase==='pilot'?'pilot':'');
}
function render(){
  renderNav();
  const v={match:viewMatch,buyers:viewBuyers,log:viewLog,crates:viewCrates,results:viewResults}[ui.tab];
  app.innerHTML=(storageOk?'':'<div class="note">This browser is not saving data. Export a backup from Results before closing.</div>')+v();
  if(ui.tab==='match'){const h=document.getElementById('harvestAt');if(h&&!h.value)h.value=toLocalInput(new Date())}
}
function farmerOptions(sel){return S.farmers.map(f=>`<option value="${f.id}" ${sel===f.id?'selected':''}>${esc(f.name)}${f.demo?' (demo)':''}</option>`).join('')}
function ripeOptions(sel){return RIPE.map(r=>`<option value="${r[0]}" ${sel===r[0]?'selected':''}>${r[1]}</option>`).join('')}

function viewMatch(){
  let h='';
  h+='<h2>Farmers</h2>';
  if(!S.farmers.length)h+='<div class="empty">No farmers yet. Add the first pilot farmer, with their consent.</div>';
  else h+='<div class="card">'+S.farmers.map(f=>`<div><b>${esc(f.name)}</b>${f.demo?'<span class="badge demo">demo</span>':''} <span class="sub">${esc(f.community||'')} ${esc(f.phone||'')}</span></div>`).join('')+'</div>';
  if(ui.showFarmerForm){
    h+=`<form class="card" data-form="farmer"><h3>New farmer</h3>
      <label>Name</label><input name="name" required>
      <div class="row"><div><label>Phone</label><input name="phone" inputmode="tel" placeholder="024 000 0000"></div><div><label>Community</label><input name="community" placeholder="e.g. Anloga"></div></div>
      <label><input type="checkbox" name="consent" required>The farmer agreed to take part and to share harvest and sales numbers.</label>
      <div class="actions"><button>Save farmer</button><button type="button" class="ghost" data-act="farmerForm">Cancel</button></div></form>`;
  } else h+='<div class="actions"><button class="ghost small" data-act="farmerForm">Add farmer</button></div>';

  h+='<h2>Post a load</h2>';
  if(!S.farmers.length)h+='<div class="sub">Add a farmer first.</div>';
  else h+=`<form class="card" data-form="load">
    <label>Farmer</label><select name="farmerId">${farmerOptions()}</select>
    <div class="row"><div><label>Amount (kg)</label><input name="kg" type="number" min="1" step="any" inputmode="decimal" required></div>
    <div><label>Ripeness</label><select name="ripeness">${ripeOptions('ripe')}</select></div></div>
    <div class="row"><div><label>Harvested at</label><input id="harvestAt" name="harvestAt" type="datetime-local" required></div>
    <div><label>Farmer's ask (GHS per kg, optional)</label><input name="ask" type="number" min="0" step="any" inputmode="decimal"></div></div>
    <label>Crate ID (optional, e.g. C1)</label><input name="crateId" maxlength="8">
    <div class="actions"><button>Find buyers</button></div></form>`;

  h+='<h2>Open loads</h2>';
  const open=S.loads.filter(l=>l.status==='open').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!open.length)h+='<div class="empty">No open loads. Post one above and the ranked buyers appear here.</div>';
  open.forEach(l=>h+=loadCard(l));
  const closed=S.loads.filter(l=>l.status==='closed').length;
  if(closed)h+=`<p class="sub">${closed} closed load${closed>1?'s':''}. Record final harvest, sold and spoiled kg in Log.</p>`;
  return h;
}
function loadCard(l){
  const f=byId(S.farmers,l.farmerId)||{name:'Unknown'};
  const rk=rankBuyers(l);
  const hrs=Math.max(0,(Date.now()-new Date(l.harvestAt).getTime())/3.6e6);
  let h=`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(f.name)}: ${esc(l.kg)} kg ${esc(ripeLabel(l.ripeness).toLowerCase())}${l.demo?'<span class="badge demo">demo</span>':''}</h3>
  <div class="sub">Harvested ${f1(hrs)} h ago${l.ask?' · asks GHS '+esc(l.ask)+'/kg':''}${l.crateId?' · crate '+esc(l.crateId):''}</div></div></div>`;
  if(l.crateId){
    if(rk.cr)h+=`<div class="sub">Crate ${esc(l.crateId)} last read ${f1(rk.cr.temp)}°C${rk.cr.rh!=null?', '+f1(rk.cr.rh)+'% RH':''}${rk.heat?' <span class="badge hot">above limit: sell first</span>':''}</div>`;
    else h+=`<div class="sub">No sensor data for crate ${esc(l.crateId)} yet. Import it in Crates.</div>`;
  }
  h+=`<div class="sub">Urgency ${Math.round(rk.u*100)}/100: higher urgency makes nearer buyers count more.</div>`;
  if(!rk.list.length)h+='<div class="empty" style="margin-top:8px">No buyers yet. Add buyers in the Buyers tab.</div>';
  const open=ui.openLoad===l.id;
  rk.list.slice(0,open?99:3).forEach((r,i)=>{h+=buyerRow(l,r,i)});
  if(rk.list.length>3)h+=`<div class="actions"><button class="ghost small" data-act="toggleLoad" data-id="${l.id}">${open?'Show top 3':'Show all '+rk.list.length+' buyers'}</button></div>`;
  h+=`<div class="actions"><button class="ghost small" data-act="closeLoad" data-id="${l.id}">Close load</button><button class="warn small" data-act="delLoad" data-id="${l.id}">Delete</button></div></div>`;
  return h;
}
function buyerRow(l,r,i){
  const b=r.buyer;
  const o=S.offers.find(x=>x.loadId===l.id&&x.buyerId===b.id);
  const msg=offerMessage(l,b);const ph=normPhone(b.phone);
  const bars=Object.keys(r.parts).map(k=>`<i style="width:${r.parts[k]}%;background:${COLORS[k]}" title="${LABELS[k]} ${f1(r.parts[k])}"></i>`).join('');
  let h=`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">
  <div class="score"><div class="num">${Math.round(r.score)}</div><div style="flex:1"><div><b>${esc(b.name)}</b>${b.demo?'<span class="badge demo">demo</span>':''} <span class="sub">${esc(b.type||'')} · ${f1(b.km)} km</span></div><div class="bar" aria-label="Score breakdown">${bars}</div></div></div>`;
  if(i===0)h+='<div class="legend">'+Object.keys(LABELS).map(k=>`<span><b style="background:${COLORS[k]}"></b>${LABELS[k]}</span>`).join('')+'</div>';
  if(!o){
    h+=`<div class="actions">${ph?`<a class="btn small" data-act="offer" data-load="${l.id}" data-buyer="${b.id}" data-ch="whatsapp" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent(msg)}">WhatsApp</a><a class="btn small ghost" data-act="offer" data-load="${l.id}" data-buyer="${b.id}" data-ch="sms" href="sms:+${ph}?body=${encodeURIComponent(msg)}">SMS</a>`:''}<button class="ghost small" data-act="offer" data-load="${l.id}" data-buyer="${b.id}" data-ch="call">I phoned them</button></div>`;
  } else {
    const st={offered:'Offer sent, waiting',accepted:'Accepted '+(o.kgAgreed||'')+' kg',declined:'Declined',noreply:'No reply'}[o.status];
    h+=`<div style="margin-top:6px"><span class="badge ${o.status==='accepted'?'':'gray'}">${st}</span> <span class="sub">via ${o.channel}, ${fmtDT(new Date(o.at).getTime())}</span></div>`;
    if(ui.ans===o.id){
      h+=`<form data-form="answer" data-id="${o.id}"><div class="row"><div><label>Kg agreed</label><input name="kg" type="number" min="1" step="any" value="${l.kg}" required></div><div><label>Price GHS/kg</label><input name="price" type="number" min="0" step="any"></div></div><div class="actions"><button class="small">Save</button><button type="button" class="ghost small" data-act="ans" data-id="">Cancel</button></div></form>`;
    } else {
      h+=`<div class="actions"><button class="small" data-act="ans" data-id="${o.id}">They accepted</button><button class="ghost small" data-act="setOffer" data-id="${o.id}" data-st="declined">Declined</button><button class="ghost small" data-act="setOffer" data-id="${o.id}" data-st="noreply">No reply</button><button class="warn small" data-act="delOffer" data-id="${o.id}">Undo</button></div>`;
    }
  }
  return h+'</div>';
}

function viewBuyers(){
  let h='<h2>Buyers</h2><p class="sub">Market traders, processors, caterers. The scorer uses these details, so keep them current.</p>';
  if(ui.showBuyerForm){
    h+=`<form class="card" data-form="buyer"><h3>New buyer</h3>
    <label>Name</label><input name="name" required>
    <div class="row"><div><label>Phone</label><input name="phone" inputmode="tel"></div><div><label>Type</label><select name="type"><option>Market trader</option><option>Processor</option><option>Caterer or hotel</option><option>Other</option></select></div></div>
    <div class="row"><div><label>Distance from the Anloga farms (km)</label><input name="km" type="number" min="0" step="any" required></div><div><label>Wants about (kg per day)</label><input name="demandKg" type="number" min="0" step="any" required></div></div>
    <div class="row"><div><label>Usual price they pay (GHS per kg, optional)</label><input name="price" type="number" min="0" step="any"></div></div>
    <label>Ripeness they buy</label><div>${RIPE.map(r=>`<label style="display:inline-block;margin-right:12px"><input type="checkbox" name="ripe_${r[0]}" ${r[0]==='ripe'||r[0]==='turning'?'checked':''}>${r[1]}</label>`).join('')}</div>
    <div class="actions"><button>Save buyer</button><button type="button" class="ghost" data-act="buyerForm">Cancel</button></div></form>`;
  } else h+='<div class="actions"><button class="small" data-act="buyerForm">Add buyer</button></div>';
  if(!S.buyers.length)h+='<div class="empty" style="margin-top:10px">No buyers yet.</div>';
  S.buyers.forEach(b=>{
    const st=buyerStats(b.id);
    h+=`<div class="card"><h3>${esc(b.name)}${b.demo?'<span class="badge demo">demo</span>':''}</h3><div class="sub">${esc(b.type)} · ${f1(b.km)} km · wants ${f1(b.demandKg)} kg/day${b.price?' · pays GHS '+f1(b.price)+'/kg':''}</div><div class="sub">Buys: ${(b.ripeness||[]).map(k=>ripeLabel(k)).join(', ')||'none set'} · answered offers: ${st.offers}, accepted: ${st.accepted}</div><div class="actions"><button class="warn small" data-act="delBuyer" data-id="${b.id}">Delete</button></div></div>`;
  });
  return h;
}

function batchStats(bs){
  const H=bs.reduce((s,b)=>s+b.harvestKg,0),So=bs.reduce((s,b)=>s+b.soldKg,0),Sp=bs.reduce((s,b)=>s+b.spoiledKg,0);
  const hs=bs.filter(b=>b.hoursToSale!=null);
  return {n:bs.length,H,unsold:H-So,share:H?(H-So)/H:null,spoil:H?Sp/H:null,hrs:hs.length?hs.reduce((s,b)=>s+b.hoursToSale,0)/hs.length:null};
}

function lineChart(pts,thr,unit){
  if(pts.length<2)return '<div class="empty">Not enough readings to draw a chart.</div>';
  const Wd=680,Ht=200,pl=42,pr=10,pt=12,pb=24;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y).concat(thr!=null?[thr]:[]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.floor(Math.min(...ys)-1),y1=Math.ceil(Math.max(...ys)+1);
  const X=v=>pl+(v-x0)/((x1-x0)||1)*(Wd-pl-pr),Y=v=>pt+(1-(v-y0)/((y1-y0)||1))*(Ht-pt-pb);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  let g='';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#d5dfd7"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#4d6355">${Math.round(v)}</text>`}
  const tick=(v,l,anchor)=>`<text x="${X(v)}" y="${Ht-6}" text-anchor="${anchor}" font-size="11" fill="#4d6355">${l}</text>`;
  const isClock=pts.clock;
  const lab=v=>isClock?new Date(v).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):(Math.round((v-x0)/3.6e6*10)/10)+' h';
  return `<svg viewBox="0 0 ${Wd} ${Ht}" width="100%" role="img" aria-label="Crate ${unit} over time">${g}
  ${thr!=null?`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="#c4301c" stroke-dasharray="5 4"/><text x="${Wd-pr}" y="${Y(thr)-4}" text-anchor="end" font-size="11" fill="#c4301c">limit ${thr}</text>`:''}
  <path d="${path}" fill="none" stroke="#2b6a3d" stroke-width="1.8"/>${tick(x0,lab(x0),'start')}${tick(x1,lab(x1),'end')}</svg>`;
}
function viewCrates(){
  const st=S.settings;
  let h=`<h2>Crate sensor data</h2><p class="sub">Take the SD card out of the crate node, copy the CRATE file to the phone, and import it here. Readings stay on this phone.</p>
  <div class="card"><label>Import a crate CSV file</label><input type="file" id="csvFile" accept=".csv,.txt,text/csv"><div class="sub" id="csvMsg">${S.sensor.at?'Last import: '+esc(S.sensor.name)+', '+new Date(S.sensor.at).toLocaleString():''}</div></div>`;
  const crates=crateList(true);
  if(!crates.length)return h+'<div class="empty">No sensor data yet.</div>';
  h+=`<div class="note">Limits used below: temperature above ${st.tempAlert}°C and humidity below ${st.rhMin}%. These are starting values. Set them from your own tests in Results, Settings.</div>`;
  h+='<div class="card scroll"><table><tr><th>Crate</th><th class="n">Readings</th><th class="n">Temp min / avg / max °C</th><th class="n">Hours above limit</th><th class="n">Hours dry</th></tr>';
  crates.forEach(c=>{
    const rs=readingsFor(c,true);const t=rs.map(r=>r.temp);const ho=hoursOutside(rs);
    h+=`<tr><td>${esc(c)}</td><td class="n">${rs.length}</td><td class="n">${f1(Math.min(...t))} / ${f1(t.reduce((a,b)=>a+b,0)/t.length)} / ${f1(Math.max(...t))}</td><td class="n">${f1(ho.hT)}</td><td class="n">${f1(ho.hR)}</td></tr>`;
  });
  h+='</table></div>';
  if(!ui.chartCrate||!crates.includes(ui.chartCrate))ui.chartCrate=crates[0];
  const rs=readingsFor(ui.chartCrate,true);
  const pts=rs.map(r=>({x:r.t,y:r.temp}));pts.clock=rs.length&&rs[0].clock;
  h+=`<div class="card"><label>Chart temperature for crate</label><select data-act="chartCrate">${crates.map(c=>`<option ${c===ui.chartCrate?'selected':''}>${esc(c)}</option>`).join('')}</select>${lineChart(pts,st.tempAlert,'temperature')}</div>`;
  // compare with batches
  const rows=crates.map(c=>{
    const bs=real(S.batches).filter(b=>String(b.crateId||'').toLowerCase()===c.toLowerCase());
    const ho=hoursOutside(readingsFor(c,false));
    const sp=bs.reduce((s,b)=>s+(b.spoiledCount||0),0);
    const s=batchStats(bs);
    return {c,n:bs.length,ho,sp,share:s.share};
  }).filter(r=>r.n>0);
  h+='<h2>Crate conditions and losses</h2>';
  if(!rows.length)h+='<div class="empty">Give batches a crate ID in the Log to compare them with sensor readings here.</div>';
  else h+='<div class="card scroll"><table><tr><th>Crate</th><th class="n">Batches</th><th class="n">Hours above limit</th><th class="n">Spoiled fruits</th><th class="n">Unsold share</th></tr>'+rows.map(r=>`<tr><td>${esc(r.c)}</td><td class="n">${r.n}</td><td class="n">${f1(r.ho.hT)}</td><td class="n">${r.sp}</td><td class="n">${pct(r.share)}</td></tr>`).join('')+'</table><p class="sub">A handful of crates can show a pattern, not prove one. Say that in the notebook.</p></div>';
  return h;
}

function bars(a,b){
  const Wd=320,Ht=170,base=140,top=24;
  const bar=(x,v,c,l)=>{const hh=v==null?0:Math.max(2,v*(base-top)/Math.max(0.0001,Math.max(a||0,b||0)));return `<rect x="${x}" y="${base-hh}" width="90" height="${hh}" rx="4" fill="${c}"/><text x="${x+45}" y="${base-hh-6}" text-anchor="middle" font-size="14" font-weight="700" fill="#15251b">${pct(v)}</text><text x="${x+45}" y="${base+18}" text-anchor="middle" font-size="12" fill="#4d6355">${l}</text>`};
  return `<svg viewBox="0 0 ${Wd} ${Ht}" width="100%" style="max-width:360px" role="img" aria-label="Unsold share, baseline versus pilot">${bar(50,a,'#8aa393','Baseline')}${bar(180,b,'#c4301c','Pilot')}<line x1="20" x2="300" y1="${base}" y2="${base}" stroke="#b9c7bd"/></svg>`;
}
function viewResults(){
  const bs=real(S.batches);

    <tr><td>Unsold kg</td><td class="n">${f1(bl.unsold)}</td><td class="n">${f1(pl.unsold)}</td></tr>

    // per farmer

    const both=rows.filter(r=>r.a.n&&r.c.n);const better=both.filter(r=>r.c.share<r.a.share).length;

    h+=`<div class="note">${both.length?`Unsold share fell for ${better} of ${both.length} farmers who have both phases.`:'No farmer has both a baseline and a pilot yet, so nothing can be compared.'} ${both.length<5?'With so few farmers this is a pilot result, not proof for the whole Anlo district. Weather, price and buyer numbers also change between weeks.':''}</div>`;
  }
  const os=real(S.offers);const ans=os.filter(o=>o.status!=='offered');
  const acc=os.filter(o=>o.status==='accepted');

  h+=`<h2>Matching</h2><div class="kpi"><div><b>${os.length}</b><span>Offers sent</span></div><div><b>${os.length?pct(acc.length/os.length):'-'}</b><span>Accepted</span></div><div><b>${os.length?pct(within/os.length):'-'}</b><span>Answered within a day</span></div></div>`;
  h+=`<h2>Settings</h2><form class="card" data-form="settings">
  <div class="row"><div><label>Current phase</label><select name="phase"><option value="baseline" ${S.settings.phase==='baseline'?'selected':''}>Baseline</option><option value="pilot" ${S.settings.phase==='pilot'?'selected':''}>Pilot</option></select></div><div><label>Selling window (days)</label><input name="windowDays" type="number" min="1" value="${S.settings.windowDays}"></div></div>
  <div class="row"><div><label>Temperature limit (°C)</label><input name="tempAlert" type="number" step="any" value="${S.settings.tempAlert}"></div><div><label>Lowest humidity (%)</label><input name="rhMin" type="number" step="any" value="${S.settings.rhMin}"></div></div>
  <label>Offer message (use {buyer} {farmer} {community} {kg} {ripeness} {price}). You can write it in Ewe.</label><textarea name="template" rows="4">${esc(S.settings.template)}</textarea>
  <div class="actions"><button>Save settings</button></div></form>`;
  h+=`<h2>Backup and data</h2><div class="card"><p class="sub">Data stays on this phone. Export a backup after every field day.</p><div class="actions"><button data-act="exportJson">Backup (JSON)</button><button class="ghost" data-act="exportBatches">Loss log (CSV)</button><button class="ghost" data-act="exportOffers">Offers (CSV)</button></div>
  <label>Restore a backup</label><input type="file" id="jsonFile" accept=".json,application/json">
  <div class="actions"><button class="ghost small" data-act="demo">Load demo data</button><button class="ghost small" data-act="rmDemo">Remove demo data</button><button class="warn small" data-act="wipe">Erase everything</button></div></div>`;
  return h;
}

/* ---------- actions ---------- */
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(rows){return rows.map(r=>r.map(csvCell).join(',')).join('\r\n')}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='chartCrate')return;
  if(a==='tab'){ui.tab=el.dataset.tab;render();window.scrollTo(0,0);return}
  if(a==='farmerForm'){ui.showFarmerForm=!ui.showFarmerForm;render();return}
  if(a==='buyerForm'){ui.showBuyerForm=!ui.showBuyerForm;render();return}
  if(a==='toggleLoad'){ui.openLoad=ui.openLoad===el.dataset.id?null:el.dataset.id;render();return}
  if(a==='offer'){
    const {load,buyer,ch}=el.dataset;
    if(!S.offers.some(o=>o.loadId===load&&o.buyerId===buyer)){
      const ld=byId(S.loads,load);
      S.offers.push({id:uid(),loadId:load,buyerId:buyer,at:new Date().toISOString(),channel:ch,status:'offered',demo:!!(ld&&ld.demo)});save();
    }
    setTimeout(render,80);return; // let the link open
  }
  if(a==='ans'){ui.ans=el.dataset.id||null;render();return}
  if(a==='setOffer'){const o=byId(S.offers,el.dataset.id);if(o){o.status=el.dataset.st;o.respondedAt=new Date().toISOString();save();render()}return}
  if(a==='delOffer'){S.offers=S.offers.filter(o=>o.id!==el.dataset.id);save();render();return}
  if(a==='closeLoad'){const l=byId(S.loads,el.dataset.id);if(l){l.status='closed';save();render();toast('Closed. Record the final kg in Log.')}return}
  if(a==='delLoad'){if(confirm('Delete this load and its offers?')){S.loads=S.loads.filter(l=>l.id!==el.dataset.id);S.offers=S.offers.filter(o=>o.loadId!==el.dataset.id);save();render()}return}
  if(a==='delBuyer'){if(confirm('Delete this buyer?')){S.buyers=S.buyers.filter(b=>b.id!==el.dataset.id);save();render()}return}
  if(a==='delBatch'){if(confirm('Delete this entry?')){S.batches=S.batches.filter(b=>b.id!==el.dataset.id);save();render()}return}
  if(a==='exportJson'){download('anlo-link-backup-'+todayStr()+'.json',JSON.stringify(S),'application/json');return}
  if(a==='exportBatches'){
    const rows=[['date','farmer','phase','crate_id','harvest_kg','sold_kg','spoiled_kg','unsold_share','hours_to_sale','spoiled_fruit_count','note']].concat(real(S.batches).map(b=>[b.date,(byId(S.farmers,b.farmerId)||{}).name,b.phase,b.crateId||'',b.harvestKg,b.soldKg,b.spoiledKg,((b.harvestKg-b.soldKg)/b.harvestKg).toFixed(4),b.hoursToSale==null?'':b.hoursToSale,b.spoiledCount==null?'':b.spoiledCount,b.note||'']));
    download('anlo-loss-log-'+todayStr()+'.csv',toCsv(rows),'text/csv');return}
  if(a==='exportOffers'){
    const rows=[['sent_at','load_id','buyer','channel','status','kg_agreed','price','answered_at']].concat(real(S.offers).map(o=>[o.at,o.loadId,(byId(S.buyers,o.buyerId)||{}).name,o.channel,o.status,o.kgAgreed||'',o.price||'',o.respondedAt||'']));
    download('anlo-offers-'+todayStr()+'.csv',toCsv(rows),'text/csv');return}
  if(a==='demo'){loadDemo();return}
  if(a==='rmDemo'){
    ['farmers','buyers','loads','offers','batches'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));
    S.sensor.rows=S.sensor.rows.filter(r=>!r[5]);save();render();toast('Demo data removed');return}
  if(a==='wipe'){if(confirm('Erase all farmers, buyers, loads, logs and sensor data on this phone?')&&confirm('This cannot be undone. Erase everything?')){S=clone(DEF);save();render()}return}
  if(a==='phase'){return}
});
document.getElementById('phaseBtn').addEventListener('click',()=>{

document.addEventListener('submit',e=>{
  const f=e.target;const kind=f.dataset.form;if(!kind)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());
  if(kind==='farmer'){S.farmers.push({id:uid(),name:d.name.trim(),phone:d.phone.trim(),community:d.community.trim(),consent:true,createdAt:new Date().toISOString()});ui.showFarmerForm=false;save();render();toast('Farmer saved')}
  if(kind==='buyer'){
    const ripe=RIPE.map(r=>r[0]).filter(k=>d['ripe_'+k]);
    S.buyers.push({id:uid(),name:d.name.trim(),phone:d.phone.trim(),type:d.type,km:num(d.km)||0,demandKg:num(d.demandKg)||0,price:num(d.price),ripeness:ripe});
    ui.showBuyerForm=false;save();render();toast('Buyer saved')}
  if(kind==='load'){
    const fm=byId(S.farmers,d.farmerId);
    S.loads.push({id:uid(),farmerId:d.farmerId,kg:num(d.kg),ripeness:d.ripeness,harvestAt:new Date(d.harvestAt).toISOString(),ask:num(d.ask),crateId:(d.crateId||'').trim(),status:'open',createdAt:new Date().toISOString(),demo:!!(fm&&fm.demo)});
    save();render();toast('Load posted. Ranked buyers are below.')}
  if(kind==='answer'){const o=byId(S.offers,f.dataset.id);if(o){o.status='accepted';o.kgAgreed=num(d.kg);o.price=num(d.price);o.respondedAt=new Date().toISOString();ui.ans=null;save();render()}}
  if(kind==='batch'){
    const H=num(d.harvestKg),So=num(d.soldKg),Sp=num(d.spoiledKg)||0;const err=document.getElementById('batchErr');
    if(So>H){err.textContent='Sold kg cannot be more than harvested kg.';return}
    if(Sp>H-So+1e-9){err.textContent='Spoiled kg cannot be more than the unsold kg (harvested minus sold).';return}
    const fm=byId(S.farmers,d.farmerId);
    S.batches.push({id:uid(),farmerId:d.farmerId,date:d.date,phase:d.phase,crateId:(d.crateId||'').trim(),harvestKg:H,soldKg:So,spoiledKg:Sp,hoursToSale:num(d.hoursToSale),spoiledCount:d.spoiledCount===''?null:num(d.spoiledCount),note:d.note||'',demo:!!(fm&&fm.demo)});
    save();render();toast('Entry saved')}
  if(kind==='settings'){
    S.settings.phase=d.phase;S.settings.windowDays=num(d.windowDays)||2;S.settings.tempAlert=num(d.tempAlert)==null?30:num(d.tempAlert);S.settings.rhMin=num(d.rhMin)==null?80:num(d.rhMin);S.settings.template=d.template||DEF.settings.template;save();render();toast('Settings saved')}
});

function importSensor(text,name){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const msg=document.getElementById('csvMsg');
  if(lines.length<2){msg.textContent='The file is empty.';return}
  const hd=lines[0].toLowerCase().split(',').map(s=>s.trim());
  const iT=hd.findIndex(h=>h==='timestamp'||h==='uptime_s'),iC=hd.indexOf('crate_id'),iTe=hd.indexOf('temp_c'),iR=hd.indexOf('rh_pct');
  if(iT<0||iC<0||iTe<0||iR<0){msg.textContent='Header not recognised. Expected: timestamp (or uptime_s), crate_id, temp_c, rh_pct.';return}
  const clock=hd[iT]==='timestamp';
  const seen=new Set(S.sensor.rows.map(r=>r[0]+'|'+(r[1]!=null?r[1]:'u'+r[2])));
  let added=0,bad=0;
  for(let i=1;i<lines.length;i++){
    const p=lines[i].split(',').map(s=>s.trim());
    const temp=parseFloat(p[iTe]),rh=parseFloat(p[iR]);
    if(!isFinite(temp)){bad++;continue}
    let ts=null,up=null;
    if(clock){ts=Date.parse(p[iT].replace(' ','T'));if(!isFinite(ts)){bad++;continue}}
    else{up=parseFloat(p[iT]);if(!isFinite(up)){bad++;continue}}
    const key=p[iC]+'|'+(ts!=null?ts:'u'+up);
    if(seen.has(key))continue;seen.add(key);
    S.sensor.rows.push([p[iC],ts,up,temp,isFinite(rh)?rh:null,0]);added++;
  }
  S.sensor.name=name;S.sensor.at=new Date().toISOString();save();render();
  toast('Imported '+added+' readings'+(bad?', skipped '+bad+' bad rows':''));
}
